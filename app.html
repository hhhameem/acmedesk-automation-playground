<!doctype html>
<html lang="en" id="root-html">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TestDesk — Customer Operations Console</title>
    <!-- The app is behind sign-in, so only the landing page (index.html at /) is indexed. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#4f46e5" />
    <script>
      // Apply the saved theme and text direction before first paint (no light/LTR flash).
      try {
        var ui = JSON.parse(localStorage.getItem('testdesk-ui') || '{}').state || {};
        var root = document.documentElement;
        if (ui.theme === 'dark') root.classList.add('dark');
        if (ui.locale) root.lang = ui.locale;
        if (ui.locale === 'ar') root.dir = 'rtl';
      } catch (e) {}
    </script>
    <style>
      /* Boot loader shown until React renders (the mock backend loads data first). */
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 14px; font: 14px system-ui, sans-serif; color: #64748b; background: #f1f5f9; }
      .dark .boot { background: #020617; color: #94a3b8; }
      .boot-mark { width: 40px; height: 40px; border-radius: 12px;
        background: linear-gradient(135deg, #818cf8, #6366f1 55%, #a855f7); animation: boot-pulse 1.2s ease-in-out infinite; }
      .boot-bar { width: 140px; height: 3px; border-radius: 999px; background: #e2e8f0; overflow: hidden; }
      .dark .boot-bar { background: #1e293b; }
      .boot-bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: inherit;
        background: #6366f1; animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-pulse { 50% { transform: scale(0.92); opacity: 0.75; } }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot-mark, .boot-bar::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-busy="true" data-testid="app-boot">
        <div class="boot-mark" aria-hidden="true"></div>
        <div class="boot-bar" aria-hidden="true"></div>
        <span>Loading TestDesk…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
